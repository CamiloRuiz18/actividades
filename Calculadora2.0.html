<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Matematica</title>
    <link rel="stylesheet" href="/actividades/Calculadora2.0.css">
</head>

<body>
    <main>
        <h1>CALCULADORA</h1>

        <div id="Cuerpo_Cal">
            <input type="text" id="pantalla" readonly>
            <div id="Botones">
                <button class="numeros">1</button>
                <button class="numeros">2</button>
                <button class="numeros">3</button>
                <button class="numeros">4</button>
                <button class="numeros">5</button>
                <button class="numeros">6</button>
                <button class="numeros">7</button>
                <button class="numeros">8</button>
                <button class="numeros">9</button>
                <button class="numeros">0</button>

                <button class="operador">+</button>
                <button class="operador">-</button>
                <button class="operador">*</button>
                <button class="operador">/</button>
                <button id="igual">=</button>
                <button id="delate">C</button>

            </div>
        </div>

    </main>
    <script src="Calculadora2.0.js"></script>
</body>
