<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Matematica</title>
</head>

<body>
    <h1>Calculadora Matematica</h1>
    <label for="numero1">Ingrese el primer numero:
        <input type="number" name="datos" id="numero1">
    </label>
    <label for="numero2">Ingrese el segundo numero:
        <input type="number" name="datos" id="numero2">
    </label>
    <label for="operacion"> Ingrese la operacion que desea realizar:
        <select id="operacion">
            <option value="suma">Suma</option>
            <option value="resta">Resta</option>
            <option value="multiplicacion">Multiplicación</option>
            <option value="division">División</option>
        </select>
    </label>
    <button id="calcular">Calcular</button>
    <p id="respuesta"></p>
    <script src="calculadora.js"></script>
</body>

</html>
